<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="robots" content="noindex" />
    <title>Opening Dev Tools…</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #0d0d0d; color: #b8b8b8; }
      main { display: grid; justify-items: center; gap: 1rem; padding: 2rem; text-align: center; }
      .spinner { width: 2rem; height: 2rem; border: 3px solid rgba(139, 92, 246, 0.25); border-top-color: #8b5cf6; border-radius: 50%; animation: spin 0.8s linear infinite; }
      p { margin: 0; }
      a { color: #ffd700; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    </style>
    <script>
      (function () {
        var path = window.location.pathname;
        var segments = path.split('/').filter(Boolean);
        var projectRoot = window.location.hostname.endsWith('github.io') && segments.length
          ? '/' + segments.shift() + '/'
          : '/';
        var route = segments.join('/');
        var destination = projectRoot;
        if (route) destination += '?route=' + encodeURIComponent(route);
        window.location.replace(destination);
      })();
    </script>
  </head>
  <body>
    <main>
      <div class="spinner" aria-hidden="true"></div>
      <p>Opening Dev Tools…</p>
      <noscript><p>JavaScript is required for clean tool routes. <a href="./">Go home</a></p></noscript>
    </main>
  </body>
</html>
