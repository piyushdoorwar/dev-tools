<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="math-evaluator-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700">
        <animate attributeName="stop-color" values="#FFD700;#8B5CF6;#FFD700" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#FFD700;#8B5CF6" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="47" fill="#1e1e1e" stroke="url(#math-evaluator-ring)" stroke-width="3" />

  <!-- square-root sign with its overbar -->
  <path d="M18 55 L28 50 L39 74 L52 26 H82" fill="none" stroke="#FFD700" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- x under the root -->
  <g fill="none" stroke="#8B5CF6" stroke-width="6" stroke-linecap="round">
    <line x1="59" y1="42" x2="75" y2="62" />
    <line x1="75" y1="42" x2="59" y2="62" />
    <animate attributeName="opacity" values="1;0.5;1" dur="2.4s" repeatCount="indefinite" />
  </g>
</svg>
