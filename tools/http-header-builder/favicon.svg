<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="hhb-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700">
        <animate attributeName="stop-color" values="#FFD700;#8B5CF6;#FFD700" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#FFD700;#8B5CF6" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="47" fill="#1e1e1e" stroke="url(#hhb-ring)" stroke-width="3" />

  <!-- Key bow -->
  <circle cx="34" cy="50" r="13" fill="none" stroke="#FFD700" stroke-width="6" />
  <circle cx="34" cy="50" r="3.5" fill="#FFD700" />

  <!-- Shaft and teeth -->
  <g fill="none" stroke="#8B5CF6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M47 50H78" />
    <path d="M70 50v11">
      <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" repeatCount="indefinite" />
    </path>
    <path d="M60 50v7" />
  </g>
</svg>
