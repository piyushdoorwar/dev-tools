<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Image Toolkit</title>
  <defs>
    <linearGradient id="tile" x1="8" y1="6" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9b6cff"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="17" fill="url(#tile)"/>

  <!-- No corner badge: at 16px a badge's inner glyph collapsed to a single
       pixel. Full-size shapes and one yellow accent survive a browser tab. -->
  <rect x="12" y="14" width="40" height="32" rx="6" fill="none" stroke="#fff" stroke-width="4"/>
  <circle cx="23" cy="25" r="4.4" fill="#ffd700"/>
  <path d="M14 42l11-11 8 8 6-6 11 9" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Three tiles for the three workflows: convert, icon pack, SVG. -->
  <rect x="20" y="52" width="7" height="7" rx="2" fill="#ffd700"/>
  <rect x="28.5" y="52" width="7" height="7" rx="2" fill="#ffd700"/>
  <rect x="37" y="52" width="7" height="7" rx="2" fill="#ffd700"/>
</svg>
