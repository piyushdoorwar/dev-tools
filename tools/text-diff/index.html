<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Diff Tool</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="../main.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div id="toast-container"></div>
        <header class="header">
            <div class="header-left">
                <h1 class="app-title">Text Diff Tool</h1>
            </div>
            <div class="header-right">
                <div class="diff-stats" id="diff-stats">
                    <span class="stat-item added"><span class="stat-count" id="stat-added">0</span> Added</span>
                    <span class="stat-item removed"><span class="stat-count" id="stat-removed">0</span> Removed</span>
                    <span class="stat-item modified"><span class="stat-count" id="stat-modified">0</span> Modified</span>
                </div>
                <button class="info-btn" id="diffLegendBtn" aria-label="Diff color legend" data-tooltip="Diff colors">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#i-info"></use></svg>
                </button>
            </div>
        </header>
        <div class="main-content">
            <div class="editor-panel left-panel">
                <div class="panel-header">
                    <h2 class="panel-title">Original Text</h2>
                    <div class="action-bar">
                        <button class="action-btn" data-action="undo" data-editor="left" data-tooltip="Undo (Ctrl+Z)"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#i-undo"></use></svg></button>
                        <button class="action-btn" data-action="copy" data-editor="left" data-tooltip="Copy"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#i-copy"></use></svg></button>
                        <button class="action-btn" data-action="paste" data-editor="left" data-tooltip="Paste"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#i-paste"></use></svg></button>
                        <button class="action-btn" data-action="sample" data-editor="left" data-tooltip="Load Sample Text"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-file-code"></use></svg></button>
                        <button class="action-btn" data-action="normalize" data-editor="left" data-tooltip="Normalize Whitespace"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#i-align"></use></svg></button>
                        <button class="action-btn" data-action="download" data-editor="left" data-tooltip="Download Text File"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-download"></use></svg></button>
                        <button class="action-btn" data-action="clear" data-editor="left" data-tooltip="Clear"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#i-trash"></use></svg></button>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="code-editor-wrapper">
                        <div class="line-numbers" id="left-line-numbers"></div>
                        <div class="editor-content-wrapper">
                            <div class="editor-highlights" id="left-highlights"></div>
                            <textarea class="editor-textarea" id="left-editor" spellcheck="false" placeholder="Enter original text here..."></textarea>
                        </div>
                    </div>
                    <div class="status-bar" id="left-status"><span class="status-text">Ready</span><span class="char-count">0 characters</span></div>
                </div>
            </div>
            <div class="editor-panel right-panel">
                <div class="panel-header">
                    <h2 class="panel-title">Modified Text</h2>
                    <div class="action-bar">
                        <button class="action-btn" data-action="undo" data-editor="right" data-tooltip="Undo (Ctrl+Z)"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#i-undo"></use></svg></button>
                        <button class="action-btn" data-action="copy" data-editor="right" data-tooltip="Copy"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#i-copy"></use></svg></button>
                        <button class="action-btn" data-action="paste" data-editor="right" data-tooltip="Paste"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#i-paste"></use></svg></button>
                        <button class="action-btn" data-action="sample" data-editor="right" data-tooltip="Load Sample Text"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-file-code"></use></svg></button>
                        <button class="action-btn" data-action="normalize" data-editor="right" data-tooltip="Normalize Whitespace"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#i-align"></use></svg></button>
                        <button class="action-btn" data-action="download" data-editor="right" data-tooltip="Download Text File"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-download"></use></svg></button>
                        <button class="action-btn" data-action="clear" data-editor="right" data-tooltip="Clear"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#i-trash"></use></svg></button>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="code-editor-wrapper">
                        <div class="line-numbers" id="right-line-numbers"></div>
                        <div class="editor-content-wrapper">
                            <div class="editor-highlights" id="right-highlights"></div>
                            <textarea class="editor-textarea" id="right-editor" spellcheck="false" placeholder="Enter modified text here..."></textarea>
                        </div>
                    </div>
                    <div class="status-bar" id="right-status"><span class="status-text">Ready</span><span class="char-count">0 characters</span></div>
                </div>
            </div>
        </div>
        <div class="modal-overlay" id="diffLegendModal" aria-hidden="true" data-modal>
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title">Diff Colors</h3>
                    <button class="modal-close" id="diffLegendCloseBtn" data-modal-close><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#i-close"></use></svg></button>
                </div>
                <div class="modal-body">
                    <div class="legend-grid">
                        <div class="legend-row">
                            <span class="legend-swatch added"></span>
                            <div class="legend-text">
                                <div class="legend-title">Added</div>
                                <div class="legend-desc">Present only in the modified text.</div>
                            </div>
                        </div>
                        <div class="legend-row">
                            <span class="legend-swatch removed"></span>
                            <div class="legend-text">
                                <div class="legend-title">Removed</div>
                                <div class="legend-desc">Present only in the original text.</div>
                            </div>
                        </div>
                        <div class="legend-row">
                            <span class="legend-swatch modified"></span>
                            <div class="legend-text">
                                <div class="legend-title">Modified</div>
                                <div class="legend-desc">Line changed between left and right editors.</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../main.js"></script>
    <script src="script.js"></script>
</body>
</html>
