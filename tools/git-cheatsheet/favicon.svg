<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gitCheatRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700">
        <animate attributeName="stop-color" values="#FFD700;#8B5CF6;#FFD700" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#FFD700;#8B5CF6" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="47" fill="#1e1e1e" stroke="url(#gitCheatRing)" stroke-width="3" />

  <!-- Trunk -->
  <line x1="36" y1="28" x2="36" y2="72" stroke="#FFD700" stroke-width="6" stroke-linecap="round" />
  <!-- Branch curving back into the trunk -->
  <path d="M64 36 V42 C64 56 36 52 36 64" fill="none" stroke="#8B5CF6" stroke-width="6" stroke-linecap="round" />

  <g stroke="#1e1e1e" stroke-width="3">
    <circle cx="36" cy="27" r="9" fill="#FFD700" />
    <circle cx="36" cy="73" r="9" fill="#FFD700" />
    <circle cx="64" cy="31" r="9" fill="#8B5CF6">
      <animate attributeName="opacity" values="1;0.55;1" dur="2.4s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
