<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="keiRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700">
        <animate attributeName="stop-color" values="#FFD700;#8B5CF6;#FFD700" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#FFD700;#8B5CF6" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="47" fill="#1e1e1e" stroke="url(#keiRing)" stroke-width="3" />

  <!-- Keycap skirt -->
  <rect x="23" y="30" width="54" height="46" rx="11" fill="#8B5CF6" opacity="0.45" />

  <!-- Keycap face with a bold K; the face presses down now and then -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 5;0 0" keyTimes="0;0.7;0.8;1" dur="2.4s" repeatCount="indefinite" />
    <rect x="23" y="22" width="54" height="46" rx="11" fill="#1e1e1e" stroke="#FFD700" stroke-width="6" />
    <g fill="none" stroke="#8B5CF6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <line x1="42" y1="34" x2="42" y2="56" />
      <polyline points="58,34 44,45 58,56" />
    </g>
  </g>
</svg>
