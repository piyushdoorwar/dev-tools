<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700">
        <animate attributeName="stop-color" values="#FFD700;#8B5CF6;#FFD700" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#FFD700;#8B5CF6" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="47" fill="#1e1e1e" stroke="url(#ring)" stroke-width="3" />

  <g fill="none" stroke="#FFD700" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="stroke" values="#FFD700;#FFE55C;#FFD700" dur="2.8s" repeatCount="indefinite" />
    <polyline points="30 34 18 50 30 66" />
  </g>

  <g fill="none" stroke="#8B5CF6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="stroke" values="#8B5CF6;#A78BFA;#8B5CF6" dur="2.8s" repeatCount="indefinite" />
    <polyline points="70 34 82 50 70 66" />
  </g>

  <g stroke="url(#ring)" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="44" y1="66" x2="56" y2="34">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite" />
    </line>
  </g>
</svg>
